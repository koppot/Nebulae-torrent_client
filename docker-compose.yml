# docker-compose.yml — Nebulae Server (headless)
#
# Quick start:
#   1. Set NEBULAE_TOKEN in .env or export it.
#   2. docker compose up -d
#   3. Configure the Nebulae desktop client:
#        Settings → Server → URL: http://<server-ip>:9174
#        Settings → Server → Token: <your-token>

services:
  nebulae-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nebulae-server
    restart: unless-stopped
    ports:
      - "9174:9174"       # nebulae-server REST API
      - "51413:51413"     # BitTorrent peer (TCP)
      - "51413:51413/udp" # BitTorrent peer (UDP)
    environment:
      - NEBULAE_TOKEN=${NEBULAE_TOKEN:?Set NEBULAE_TOKEN in .env or environment}
      - NEBULAE_PORT=9174
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - nebulae-config:/data/config
      - ${DOWNLOAD_DIR:-./downloads}:/data/downloads
      - ${WATCH_DIR:-./watch}:/data/watch
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9174/api/v1/status", "-H", "Authorization: Bearer ${NEBULAE_TOKEN}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  nebulae-config:

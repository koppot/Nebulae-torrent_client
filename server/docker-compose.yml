# Nebulae Server — docker compose (beta)
#
# 1. Create a .env file next to this file with:
#        NEBULAE_SERVER_TOKEN=<long random string>
# 2. docker compose up -d
# 3. In the Nebulae desktop app: Settings -> Server, enable the bridge,
#    enter http://<server-ip>:9174 and the token, Test connection, restart Nebulae.

services:
  nebulae-server:
    image: ghcr.io/koppot/nebulae-server:beta
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: nebulae-server
    restart: unless-stopped
    environment:
      # Required: the bearer token the desktop app must present.
      - NEBULAE_SERVER_TOKEN=${NEBULAE_SERVER_TOKEN:?Set NEBULAE_SERVER_TOKEN in your .env or Unraid template}
      # Optional: override the bridge listen address inside the container.
      # - NEBULAE_LISTEN=0.0.0.0:9174
    ports:
      - "9174:9174" # Nebulae bridge API (desktop app connects here)
      - "6881:6881" # BitTorrent TCP
      - "6881:6881/udp" # DHT UDP
    volumes:
      - /mnt/user/appdata/nebulae-server:/data

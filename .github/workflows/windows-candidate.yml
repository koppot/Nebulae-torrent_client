name: Windows Candidate Build

# Build-only candidate packaging for the Windows x64 0.2.4 release candidate.
# Dispatched manually (workflow_dispatch). Builds the MSVC release via `pnpm tauri
# build`, stages the pinned runtime tree, produces the NSIS installer, runs the PE
# audit on the packaged executable + resources, and runs a silent install smoke
# test. Uploads artifacts only. Never creates a release, never moves or creates tags,
# never touches latest.json or any updater asset, never publishes.
#
# This is an UNSIGNED test candidate: createUpdaterArtifacts is disabled because
# Factory B holds no Tauri signing private key. It does NOT satisfy final-release
# requirements. GeoLite2 databases are NOT staged (--require-geo not invoked), so
# this build is explicitly INCOMPLETE and not release-ready (release blocker P-08).
#
# Authorized by the owner: one scratch branch, one artifacts-only workflow.

on:
  workflow_dispatch: {}

jobs:
  windows-candidate:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      NEBULAE_CACHE: C:\nebulae-cache
      NEBULAE_STAGE: C:\nebulae-stage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Rust toolchain (pinned 1.99.1, MSVC target)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          target: x86_64-pc-windows-msvc

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install 7-Zip (for MSI/cab extraction during staging)
        shell: pwsh
        run: |
          winget install 7zip.7zip --accept-package-agreements --accept-source-agreements || true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download and verify pinned inputs
        shell: bash
        run: |
          mkdir -p "$NEBULAE_CACHE"
          python3 scripts/windows/fetch_inputs.py \
            --cache "$NEBULAE_CACHE"

      - name: Stage runtime resources (pinned inputs; no exe, no --require-geo for candidate)
        shell: bash
        run: |
          mkdir -p "$NEBULAE_STAGE"
          python3 scripts/windows/stage_runtime.py \
            --cache "$NEBULAE_CACHE" \
            --out "$NEBULAE_STAGE" \
            --manifest "$NEBULAE_STAGE/resources/build-manifest.json" \
            --no-audit

      - name: Copy staged resources to src-tauri/resources
        shell: bash
        run: |
          rm -rf src-tauri/resources
          cp -r "$NEBULAE_STAGE/resources" src-tauri/resources

      - name: Disable updater artifacts for candidate (no signing key available)
        shell: bash
        run: |
          python3 << 'EOF'
          import json
          p = 'src-tauri/tauri.conf.json'
          d = json.load(open(p))
          d['bundle']['createUpdaterArtifacts'] = False
          with open(p, 'w') as f:
              json.dump(d, f, indent=2)
              f.write('\n')
          print('createUpdaterArtifacts set to false for candidate build')
          EOF

      - name: Build NSIS installer (Tauri bundler 2.10.2; builds Rust internally)
        shell: bash
        run: |
          pnpm tauri build --bundles nsis

      - name: Locate packaged nebulae.exe and record source identity
        shell: bash
        run: |
          EXE=$(find src-tauri/target/release -maxdepth 1 -name "nebulae.exe" -type f | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::Packaged nebulae.exe not found in src-tauri/target/release/"
            exit 1
          fi
          echo "PACKAGED_EXE=$EXE" >> "$GITHUB_ENV"
          sha256sum "$EXE" | tee "$EXE.sha256"
          {
            echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
            git log -1 --format='%H%n%ci%n%s'
          } > candidate-source.txt
          cat candidate-source.txt

      - name: Build PE audit tree (packaged resources + packaged executable)
        shell: bash
        run: |
          rm -rf "$NEBULAE_STAGE/audit"
          mkdir -p "$NEBULAE_STAGE/audit"
          cp -r "$NEBULAE_STAGE/resources" "$NEBULAE_STAGE/audit/resources"
          cp "$PACKAGED_EXE" "$NEBULAE_STAGE/audit/nebulae.exe"
          echo "Audit tree files: $(find "$NEBULAE_STAGE/audit" -type f | wc -l)"

      - name: Run PE audit on packaged tree
        shell: bash
        run: |
          python3 scripts/windows/pe_audit.py audit "$NEBULAE_STAGE/audit" --layout nebulae \
            --fail-on-missing \
            --fail-on-vcredist

      - name: Silent install smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Locate the NSIS installer produced by the Tauri bundler.
          $installer = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis\*.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) {
            throw "FATAL: NSIS installer not found in src-tauri\target\release\bundle\nsis"
          }
          Write-Host "Installer: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 1)) MB)"

          # Record installer identity.
          $installerHash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "Installer SHA-256: $installerHash"

          # Silent install.
          Write-Host "Running silent install (/S)..."
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "FATAL: silent install failed with exit code $($install.ExitCode)"
          }
          Write-Host "Silent install succeeded (exit code 0)."

          # Verify installed executable and sidecars
          $installDir = Join-Path $env:LOCALAPPDATA "Nebulae"
          $installedExe = Join-Path $installDir "nebulae.exe"
          if (-not (Test-Path $installedExe)) {
            throw "FATAL: installed nebulae.exe not found at $installedExe"
          }
          $exeHash = (Get-FileHash -Path $installedExe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Installed nebulae.exe SHA-256: $exeHash"

          # Verify sidecar directories exist under resources
          $resourcesDir = Join-Path $installDir "resources"
          $vlcDir = Join-Path $resourcesDir "vlc"
          $engineDir = Join-Path $resourcesDir "engine"
          if (-not (Test-Path $vlcDir)) {
            throw "FATAL: resources/vlc not found at $vlcDir"
          }
          if (-not (Test-Path $engineDir)) {
            throw "FATAL: resources/engine not found at $engineDir"
          }
          Write-Host "Verified resources layout ($vlcDir and $engineDir exist)"

          # Silent uninstall
          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "FATAL: uninstaller not found at $uninstaller"
          }
          Write-Host "Running silent uninstall (/S _?=$installDir)..."
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S', ("_?=" + $installDir) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "FATAL: silent uninstall failed with exit code $($uninstall.ExitCode)"
          }
          Write-Host "Silent uninstall succeeded (exit code 0)."

      - name: Prepare artifact directory
        shell: bash
        run: |
          mkdir -p artifacts
          cp candidate-source.txt artifacts/
          cp "$NEBULAE_STAGE/resources/build-manifest.json" artifacts/build-manifest.json
          # Find and copy the NSIS installer.
          INSTALLER=$(find src-tauri/target/release/bundle/nsis -name "*.exe" -type f | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "::error::NSIS installer not found"
            exit 1
          fi
          cp "$INSTALLER" artifacts/Nebulae-Setup-x64.exe
          sha256sum artifacts/Nebulae-Setup-x64.exe > artifacts/Nebulae-Setup-x64.exe.sha256
          # Copy the packaged executable and its checksum.
          cp "$PACKAGED_EXE" artifacts/nebulae.exe
          sha256sum artifacts/nebulae.exe > artifacts/nebulae.exe.sha256
          # Aggregate SHA256SUMS (no || true — fail if missing).
          (cd artifacts && sha256sum Nebulae-Setup-x64.exe nebulae.exe > SHA256SUMS.txt)

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-${{ github.run_id }}
          path: |
            artifacts/**
            candidate-source.txt
          retention-days: 14

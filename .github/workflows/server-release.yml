name: Server Release

# Builds the headless nebulae-server bridge for Linux servers:
#  - glibc binaries (x86_64) attached to a GitHub release
#  - a multi-stage Docker image (rtorrent + bridge) pushed to GHCR
#
# Triggers: pushing a tag like nebulae-server-v0.1.0-beta.1, or manually.

on:
  workflow_dispatch:
  push:
    tags:
      - "nebulae-server-v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nebulae-server

jobs:
  build-binary:
    name: Build nebulae-server (x86_64 linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            pkg-config \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: server-${{ runner.os }}-stable-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build headless bridge
        working-directory: src-tauri
        run: cargo build --release --bin nebulae-server

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#nebulae-server-v}"
          STAGING="nebulae-server-${VERSION}-linux-x86_64"
          mkdir -p "$STAGING"
          cp src-tauri/target/release/nebulae-server "$STAGING/"
          cp server/rtorrent.rc "$STAGING/"
          cp server/entrypoint.sh "$STAGING/"
          cp README.md "$STAGING/"
          tar -czf "$STAGING.tar.gz" "$STAGING"
          sha256sum "$STAGING.tar.gz" > "$STAGING.tar.gz.sha256"
          echo "STAGING=$STAGING" >> "$GITHUB_ENV"

      - name: Smoke test (mock engine, token auth)
        run: |
          src-tauri/target/release/nebulae-server --engine mock --scgi /nonexistent \
            --listen 127.0.0.1:9199 --token smoke-test &
          SERVER_PID=$!
          sleep 2
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9199/api/v1/status)
          [ "$CODE" = "401" ] || { echo "expected 401 without token, got $CODE"; kill $SERVER_PID; exit 1; }
          curl -s -H "Authorization: Bearer smoke-test" http://127.0.0.1:9199/api/v1/status | grep -q '"engine":"mock"'
          kill $SERVER_PID
          echo "Smoke test passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebulae-server-linux-x86_64
          path: |
            nebulae-server-*-linux-x86_64.tar.gz
            nebulae-server-*-linux-x86_64.tar.gz.sha256

  docker-image:
    name: Build & push container image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#nebulae-server-v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:beta
            ${{ env.IMAGE }}:v${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Attach binaries to release
    needs: [build-binary, docker-image]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/nebulae-server-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nebulae-server-linux-x86_64

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          name: "Nebulae Server ${{ github.ref_name }}"
          prerelease: true
          body: |
            Headless Nebulae Server bridge for rtorrent on Linux servers (beta).

            - `nebulae-server-*-linux-x86_64.tar.gz` — standalone bridge binary (run your own rtorrent)
            - Container image: `ghcr.io/${{ github.repository_owner }}/nebulae-server:${{ github.ref_name }}` (rtorrent + bridge)

            See `docs/nebulae-server.md` for deployment instructions.
          files: |
            nebulae-server-*-linux-x86_64.tar.gz
            nebulae-server-*-linux-x86_64.tar.gz.sha256

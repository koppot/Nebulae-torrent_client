name: Server Image

# Builds and publishes the headless Nebulae Server image (bridge + Transmission 4.1.3)
# from server/docker/Dockerfile to GHCR. The image is smoke-tested before it is pushed.
#
# Triggers: a tag like nebulae-server-v0.2.8 (publishes :0.2.8), or manually (build + smoke test only,
# or publish when "push" is ticked).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g. 0.2.8)"
        required: true
        default: "0.2.8"
      push:
        description: "Push the image to GHCR"
        type: boolean
        default: false
  push:
    tags:
      - "nebulae-server-v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/koppot/nebulae-server

jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#nebulae-server-v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/Dockerfile
          load: true
          tags: nebulae-server:smoke
          build-args: |
            BUILD_ID=${{ github.sha }}
            NEBULAE_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (auth, engine identity)
        run: |
          docker run -d --name smoke -e NEBULAE_TOKEN=smoke-token -p 9174:9174 nebulae-server:smoke
          for i in $(seq 1 30); do
            curl -sf -H "Authorization: Bearer smoke-token" http://127.0.0.1:9174/api/v1/status >/dev/null && break
            sleep 2
          done
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9174/api/v1/status)" = "401" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong' http://127.0.0.1:9174/api/v1/status)" = "401" ]
          STATUS="$(curl -s -H 'Authorization: Bearer smoke-token' http://127.0.0.1:9174/api/v1/status)"
          echo "$STATUS"
          echo "$STATUS" | grep -q '"engine_version":"4.1.3'
          echo "$STATUS" | grep -q "\"build_id\":\"${GITHUB_SHA}\""
          docker rm -f smoke

      - name: Log in to GHCR
        if: github.ref_type == 'tag' || inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref_type == 'tag' || inputs.push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            BUILD_ID=${{ github.sha }}
            NEBULAE_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies for Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check & Frontend build
        run: pnpm run build

      - name: Rust format check
        run: cargo fmt --all -- --check
        working-directory: ./src-tauri

      - name: Rust clippy
        run: cargo clippy -- -D warnings
        working-directory: ./src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: ./src-tauri

  # Windows compile + test gate: the ubuntu job above never compiles the
  # windows-only code paths (cfg(windows) native window/drag/spawn code),
  # which is how the candidate build 39351367957 failed on errors that CI
  # never saw. This job compiles and unit-tests on the real target.
  windows-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure frontend dist directory exists
        run: mkdir dist
        shell: bash

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python (for D3D11 regression checks)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Windows compile check
        run: cargo check --lib
        working-directory: ./src-tauri

      - name: Windows unit tests
        run: cargo test --lib

      - name: D3D11 HDR-to-SDR plugin regression check
        run: |
          python3 scripts/windows/regression-check-d3d11.py
          python3 -m unittest discover -s scripts/windows/tests
        shell: bash
        working-directory: ./src-tauri

  # macOS compile + test gate: compiles and tests macOS-specific code paths
  # (objc2 AppKit/Foundation/QuartzCore, macOS status bar, keyrings, paths).
  macos-tests:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure frontend dist directory exists
        run: mkdir dist
        shell: bash

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: macOS compile check
        run: cargo check --lib
        working-directory: ./src-tauri

      - name: Install transmission-daemon
        run: brew install transmission-cli

      - name: macOS unit tests
        run: cargo test
        working-directory: ./src-tauri

name: Build Test Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - 'ag/transmission-engine'
      - 'fix/cross-platform-repair'

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    permissions:
      contents: write
    env:
      WINDOWS_SIGN_PROVIDER: 'none'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''
            artifact_name: 'Nebulae-Linux-x86_64'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
            artifact_name: 'Nebulae-macOS-arm64.dmg'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
            artifact_name: 'Nebulae-macOS-x64.dmg'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
            artifact_name: 'Nebulae-Setup-x64.exe'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies for Linux (Ubuntu 22.04 pinned baseline)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools \
            patchelf \
            rpm \
            dpkg \
            binutils \
            xvfb \
            desktop-file-utils \
            libdvdnav4 \
            libbluray2 \
            libvlc5 \
            vlc-plugin-base \
            vlc-plugin-video-output

      # Full portability on Linux: stage the runner's VLC runtime into resources
      - name: Bundle libVLC (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p src-tauri/resources/vlc/lib src-tauri/resources/vlc/plugins
          cp -rL /usr/lib/x86_64-linux-gnu/libvlc*.so* src-tauri/resources/vlc/lib/
          cp -rL /usr/lib/x86_64-linux-gnu/vlc/plugins/. src-tauri/resources/vlc/plugins/ || true
          chmod -R u+rwX,go+rX src-tauri/resources/vlc
          ls src-tauri/resources/vlc/lib | head -3

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Temurin JDK 21 (bundled JRE for BD-J/UHD menus)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # --- Transmission-daemon sidecar bundling -------------------------------
      - name: Bundle transmission-daemon engine (Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/bundle-windows-transmission.ps1

      - name: Bundle transmission-daemon engine (Linux)
        if: runner.os == 'Linux'
        run: |
          ./scripts/bundle-linux-transmission.sh

      - name: Install transmission-cli on macOS runner
        if: runner.os == 'macOS'
        run: |
          brew install transmission-cli || brew upgrade transmission-cli || true

      - name: Bundle transmission-daemon engine (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/bundle-macos-transmission.sh

      # --- Media playback bundling (libVLC & JRE) -----------------------------
      - name: Bundle libVLC (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then VLCARCH=arm64; else VLCARCH=intel64; fi
          curl -fL -o vlc.dmg "https://download.videolan.org/pub/videolan/vlc/3.0.21/macosx/vlc-3.0.21-${VLCARCH}.dmg"
          hdiutil attach vlc.dmg -mountpoint /tmp/vlcmnt -nobrowse -quiet
          mkdir -p src-tauri/resources/vlc
          cp -R /tmp/vlcmnt/VLC.app/Contents/MacOS/lib src-tauri/resources/vlc/
          cp -R /tmp/vlcmnt/VLC.app/Contents/MacOS/plugins src-tauri/resources/vlc/
          cp -R /tmp/vlcmnt/VLC.app/Contents/Frameworks src-tauri/resources/vlc/ || true
          hdiutil detach /tmp/vlcmnt -quiet || true
          ls src-tauri/resources/vlc

      - name: Bundle libVLC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://download.videolan.org/pub/videolan/vlc/3.0.21/win64/vlc-3.0.21-win64.zip'
          Invoke-WebRequest -Uri $url -OutFile vlc.zip
          Expand-Archive -Path vlc.zip -DestinationPath vlcextract
          New-Item -ItemType Directory -Force -Path src-tauri/resources/vlc | Out-Null
          Get-ChildItem -Path vlcextract/vlc-3.0.21 -Exclude '*.exe','*.txt','*.nsi','*.html' |
            Copy-Item -Destination src-tauri/resources/vlc -Recurse -Force
          Get-ChildItem src-tauri/resources/vlc | Select-Object -First 10

      - name: Bundle JRE (BD-J/UHD menus)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then OS=windows; EXT=zip; else OS=linux; EXT=tar.gz; [ "$RUNNER_OS" = "macOS" ] && OS=mac || true; fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then A=aarch64; else A=x64; fi
          else
            A=x64
          fi
          curl -fL -o jre.$EXT "https://api.adoptium.net/v3/binary/latest/21/ga/$OS/$A/jre/hotspot/normal/eclipse"
          mkdir -p jrex src-tauri/resources/jre
          if [ "$EXT" = "zip" ]; then
            unzip -q jre.$EXT -d jrex || tar xf jre.$EXT -C jrex
          else
            tar xzf jre.$EXT -C jrex
          fi
          # macOS tarballs nest the runtime in Contents/Home.
          HOME_DIR=$(find jrex -type d -name Home -path '*Contents*' | head -1 || true)
          if [ -z "$HOME_DIR" ]; then
            BIN_DIR=$(find jrex -type d -name bin | head -1)
            HOME_DIR=$(dirname "$BIN_DIR")
          fi
          cp -a "$HOME_DIR"/. src-tauri/resources/jre/
          chmod -R u+rwX,go+rX src-tauri/resources/jre || true
          test -e src-tauri/resources/jre/bin/java || test -e src-tauri/resources/jre/bin/java.exe || { echo "JRE staging failed"; find jrex | head -20; exit 1; }
          ls src-tauri/resources/jre/bin | head -3

      # --- Linux split build ------------------------------------------------
      - name: Build Linux packages with bundled player (deb, rpm)
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles deb,rpm

      - name: Build Linux AppImage without engine resources
        if: runner.os == 'Linux'
        run: |
          rm -rf src-tauri/transmission-staging-appimage
          if [ -d src-tauri/resources/engine ]; then
            mv src-tauri/resources/engine src-tauri/transmission-staging-appimage
          fi
          rm -rf src-tauri/vlc-staging-appimage src-tauri/jre-staging-appimage
          mv src-tauri/resources/vlc src-tauri/vlc-staging-appimage
          mv src-tauri/resources/jre src-tauri/jre-staging-appimage
          pnpm tauri build --bundles appimage

      - name: Inject bundled player + engine into AppImage
        if: runner.os == 'Linux'
        run: |
          APPIMAGE_PATH="$(find src-tauri/target -name '*.AppImage' -type f | head -n 1)"
          OFFSET="$("$APPIMAGE_PATH" --appimage-offset)"
          dd if="$APPIMAGE_PATH" of=/tmp/appimage-runtime bs="$OFFSET" count=1 status=none
          "$APPIMAGE_PATH" --appimage-extract > /dev/null
          mkdir -p squashfs-root/usr/share/nebulae/resources/engine
          rm -rf squashfs-root/usr/share/nebulae/resources/engine
          cp -a src-tauri/transmission-staging-appimage/. squashfs-root/usr/share/nebulae/resources/engine/
          rm -rf squashfs-root/usr/share/nebulae/resources/vlc squashfs-root/usr/share/nebulae/resources/jre
          cp -a src-tauri/vlc-staging-appimage squashfs-root/usr/share/nebulae/resources/vlc
          cp -a src-tauri/jre-staging-appimage squashfs-root/usr/share/nebulae/resources/jre
          if [ ! -f squashfs-root/usr/share/nebulae/resources/engine/transmission/transmission-daemon ]; then
            echo "ERROR: transmission-daemon missing from AppImage engine staging"
            find squashfs-root/usr/share/nebulae/resources/ -maxdepth 3 | head -30
            exit 1
          fi
          mksquashfs squashfs-root /tmp/appimage-payload.squashfs -root-owned -noappend
          cat /tmp/appimage-runtime /tmp/appimage-payload.squashfs > "$APPIMAGE_PATH.new"
          chmod +x "$APPIMAGE_PATH.new"
          mv "$APPIMAGE_PATH.new" "$APPIMAGE_PATH"
          rm -rf squashfs-root
          LISTING="$(unsquashfs -l /tmp/appimage-payload.squashfs 2>&1 || true)"
          printf '%s\n' "$LISTING" | grep -q "resources/engine/transmission/transmission-daemon" || { echo "ERROR: transmission-daemon missing from repacked AppImage"; exit 1; }
          printf '%s\n' "$LISTING" | grep -q "resources/vlc" || { echo "ERROR: vlc missing from repacked AppImage"; exit 1; }
          printf '%s\n' "$LISTING" | grep -q "resources/jre/bin/java" || { echo "ERROR: jre missing from repacked AppImage"; exit 1; }
          echo "SUCCESS: engine, vlc, and jre injected into $APPIMAGE_PATH"

      # --- macOS / Windows Build --------------------------------------------
      - name: Build Tauri Application
        if: runner.os != 'Linux'
        run: pnpm tauri build ${{ matrix.args }}

      # --- Post-Build Package Contents Verification -------------------------
      - name: Verify Package Contents (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_DIR=$(find src-tauri/target -name "Nebulae.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then echo "ERROR: Nebulae.app not found"; exit 1; fi
          echo "=== Verifying macOS package contents in $APP_DIR ==="
          test -f "$APP_DIR/Contents/Resources/resources/engine/transmission/transmission-daemon" || { echo "ERROR: transmission-daemon missing in app bundle"; exit 1; }
          test -d "$APP_DIR/Contents/Resources/resources/vlc" || { echo "ERROR: vlc missing in app bundle"; exit 1; }
          test -f "$APP_DIR/Contents/Resources/resources/jre/bin/java" || { echo "ERROR: jre/bin/java missing in app bundle"; exit 1; }
          echo "SUCCESS: macOS app bundle contains transmission-daemon, vlc, and jre."

      - name: Verify Package Contents (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== Verifying Windows staged resources and build outputs ==="
          if (-not (Test-Path "src-tauri/resources/engine/transmission/transmission-daemon.exe")) { throw "transmission-daemon.exe missing from resources" }
          if (-not (Test-Path "src-tauri/resources/vlc/libvlc.dll")) { throw "libvlc.dll missing from resources" }
          if (-not (Test-Path "src-tauri/resources/jre/bin/java.exe")) { throw "java.exe missing from resources" }
          $setup = Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "*setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Setup installer not found in target" }
          Write-Host "SUCCESS: Windows staged resources verified. Setup size: $($setup.Length) bytes."

      - name: Verify Package Contents (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "=== Verifying Linux package contents ==="
          DEB_FILE=$(find src-tauri/target -name "*.deb" -type f | head -n 1)
          if [ -n "$DEB_FILE" ]; then
            dpkg-deb -c "$DEB_FILE" | grep -q "resources/engine/transmission/transmission-daemon" || { echo "ERROR: transmission-daemon missing in deb"; exit 1; }
            dpkg-deb -c "$DEB_FILE" | grep -q "resources/vlc" || { echo "ERROR: vlc missing in deb"; exit 1; }
            dpkg-deb -c "$DEB_FILE" | grep -q "resources/jre/bin/java" || { echo "ERROR: jre missing in deb"; exit 1; }
            echo "SUCCESS: deb package verified."
          fi

      # --- Prepare Artifacts (macOS) ----------------------------------------
      - name: Prepare Named Artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_DIR=$(find src-tauri/target -name "Nebulae.app" -type d | head -n 1)
          DMG_FILE=$(find src-tauri/target -name "*.dmg" -type f | head -n 1)
          ICON_PATH="$(pwd)/src-tauri/icons/icon.icns"
          DMG_NAME="${{ matrix.artifact_name }}"

          echo "=== Building DMG with Embedded Volume Icon ==="
          if [ -n "$APP_DIR" ]; then
            STAGING_DIR=$(mktemp -d)
            cp -R "$APP_DIR" "$STAGING_DIR/Nebulae.app"
            ln -s /Applications "$STAGING_DIR/Applications"
            cp "$ICON_PATH" "$STAGING_DIR/.VolumeIcon.icns"
            SetFile -c icnC "$STAGING_DIR/.VolumeIcon.icns" || true
            rm -f "$DMG_NAME" "$DMG_NAME.rw.dmg"
            hdiutil create -volname "Nebulae" -srcfolder "$STAGING_DIR" -fs HFS+ -ov -format UDRW "$DMG_NAME.rw.dmg"
            DMG_MNT="$(mktemp -d)/volume"
            hdiutil attach "$DMG_NAME.rw.dmg" -mountpoint "$DMG_MNT" -nobrowse -noautoopen
            SetFile -a C "$DMG_MNT"
            hdiutil detach "$DMG_MNT"
            hdiutil convert "$DMG_NAME.rw.dmg" -format UDZO -o "$DMG_NAME" -ov
            rm -rf "$STAGING_DIR" "$DMG_NAME.rw.dmg"
            DMG_VERIFY_MNT="$(mktemp -d)/volume"
            hdiutil attach "$DMG_NAME" -mountpoint "$DMG_VERIFY_MNT" -nobrowse -readonly
            xattr -l "$DMG_VERIFY_MNT" 2>/dev/null | grep -q "com.apple.FinderInfo" || {
              echo "ERROR: custom icon flag missing from DMG volume"
              hdiutil detach "$DMG_VERIFY_MNT" || true
              exit 1
            }
            hdiutil detach "$DMG_VERIFY_MNT"
            echo "DMG volume icon verified."
          elif [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" "$DMG_NAME"
          fi

          if [ -f "$DMG_NAME" ]; then
            shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"
          fi

          if [ -n "$APP_DIR" ]; then
            APP_ZIP="$DMG_NAME-app.zip"
            ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$APP_ZIP"
            shasum -a 256 "$APP_ZIP" > "$APP_ZIP.sha256"
          fi

          mkdir -p artifacts/
          cp "$DMG_NAME" "$DMG_NAME.sha256" "$APP_ZIP" "$APP_ZIP.sha256" artifacts/

      # --- Prepare Artifacts (Windows) --------------------------------------
      - name: Prepare Named Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "*setup.exe" | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName -Destination 'Nebulae-Setup-x64.exe' -Force }
          $bin = Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "nebulae.exe" | Select-Object -First 1
          if ($bin) { Copy-Item $bin.FullName -Destination 'nebulae.exe' -Force }

          New-Item -ItemType Directory -Force -Path artifacts

          foreach ($name in @('Nebulae-Setup-x64.exe', 'nebulae.exe')) {
            if (Test-Path $name) {
              $hash = (Get-FileHash -Path $name -Algorithm SHA256).Hash.ToLower()
              "$hash  $name" | Out-File -FilePath "$name.sha256" -Encoding utf8
              Copy-Item $name "artifacts/$name"
              Copy-Item "$name.sha256" "artifacts/$name.sha256"
            }
          }

      # --- Prepare Artifacts (Linux) ----------------------------------------
      - name: Prepare Named Artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          DEB_FILE=$(find src-tauri/target -name "*.deb" -type f | head -n 1)
          RPM_FILE=$(find src-tauri/target -name "*.rpm" -type f | head -n 1)
          APPIMAGE_FILE=$(find src-tauri/target -name "*.AppImage" -type f | head -n 1)
          BINARY_FILE=$(find src-tauri/target/release -maxdepth 1 -name "nebulae" -type f | head -n 1)

          mkdir -p artifacts

          if [ -n "$DEB_FILE" ]; then
            cp "$DEB_FILE" "Nebulae-Linux-x86_64.deb"
            sha256sum "Nebulae-Linux-x86_64.deb" > "Nebulae-Linux-x86_64.deb.sha256"
            cp "Nebulae-Linux-x86_64.deb" "Nebulae-Linux-x86_64.deb.sha256" artifacts/
          fi

          if [ -n "$RPM_FILE" ]; then
            cp "$RPM_FILE" "Nebulae-Linux-x86_64.rpm"
            sha256sum "Nebulae-Linux-x86_64.rpm" > "Nebulae-Linux-x86_64.rpm.sha256"
            cp "Nebulae-Linux-x86_64.rpm" "Nebulae-Linux-x86_64.rpm.sha256" artifacts/
          fi

          if [ -n "$APPIMAGE_FILE" ]; then
            cp "$APPIMAGE_FILE" "Nebulae-Linux-x86_64.AppImage"
            chmod +x "Nebulae-Linux-x86_64.AppImage"
            sha256sum "Nebulae-Linux-x86_64.AppImage" > "Nebulae-Linux-x86_64.AppImage.sha256"
            cp "Nebulae-Linux-x86_64.AppImage" "Nebulae-Linux-x86_64.AppImage.sha256" artifacts/
          fi

          if [ -n "$BINARY_FILE" ]; then
            cp "$BINARY_FILE" "nebulae-linux-x86_64"
            chmod +x "nebulae-linux-x86_64"
            sha256sum "nebulae-linux-x86_64" > "nebulae-linux-x86_64.sha256"
            cp "nebulae-linux-x86_64" "nebulae-linux-x86_64.sha256" artifacts/
          fi

      # --- Private distribution ---------------------------------------------
      # Build outputs are attached to a standing DRAFT release ("test-builds").
      # Per-platform BUILD_INFO files are used so matrix jobs and separate runs
      # never clobber each other's metadata.
      - name: Attach build to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Prevent older superseded runs from overwriting draft release assets
          LATEST_SHA=$(git ls-remote origin "refs/heads/${{ github.ref_name }}" | cut -f1)
          if [ -n "$LATEST_SHA" ] && [ "$LATEST_SHA" != "${{ github.sha }}" ]; then
            echo "Skipping upload: current commit ${{ github.sha }} is superseded by $LATEST_SHA"
            exit 0
          fi

          INFO_FILE="BUILD_INFO-${{ matrix.artifact_name }}.txt"
          {
            echo "commit: ${{ github.sha }}"
            echo "run: ${{ github.run_id }} (#${{ github.run_number }})"
            echo "platform: ${{ matrix.platform }}"
            echo "target: ${{ matrix.target }}"
            echo "artifact: ${{ matrix.artifact_name }}"
            echo "date: $(date -u '+%Y-%m-%d %H:%M:%SZ')"
          } > "artifacts/$INFO_FILE"
          rm -f artifacts/BUILD_INFO.txt
          gh release view test-builds >/dev/null 2>&1 || \
            gh release create test-builds --draft \
              --title "Test builds (private)" \
              --notes "Owner-only test builds. NEVER publish this draft." \
              --target "${{ github.sha }}"
          uploaded=false
          for attempt in 1 2 3; do
            if gh release upload test-builds artifacts/* --clobber; then
              uploaded=true
              break
            fi
            echo "upload attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          if [ "$uploaded" != true ]; then
            echo "ERROR: could not attach assets to draft release"
            exit 1
          fi
          gh release view test-builds --json isDraft,name,assets \
            --jq '{isDraft, name, assets: [.assets[].name]}'

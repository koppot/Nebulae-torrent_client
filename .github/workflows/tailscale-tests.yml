# Branch-scoped validation for the Tailscale integration work.
# Deliberately SEPARATE from release.yml (owned by the client-repair
# workstream): this file does not build releases or overwrite any
# test-build assets. Remove or rewire when integrating.
name: tailscale-core

on:
  push:
    branches: [ts/tailscale-core]
  pull_request:
    branches: [ts/tailscale-core]
  workflow_dispatch:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build deps (taui/gtk stack, mirrors release.yml)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Unit tests (hermetic, no daemon)
        working-directory: src-tauri
        # Windows: run the tailscale-scoped suite. Two PRE-EXISTING failures
        # on windows runners (engine/transmission.rs expand-tilde,
        # commands/association.rs status structure) belong to the
        # client-repair workstream and are out of scope here.
        run: cargo test --release ${{ runner.os == 'Windows' && 'tailscale::' || '' }}

  bundler:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # macOS bundling builds tailscaled from the pinned git tag.
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Bundle pinned binaries for this platform
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
            shellcheck scripts/bundle-tailscale.sh
          fi
          ./scripts/bundle-tailscale.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-bin-${{ matrix.target }}
          path: src-tauri/resources/engine/tailscale/
          retention-days: 3

  # Native-Windows runtime validation of the PRIVATE named pipe and
  # console-suppression flags: run the bundled daemon exactly the way the
  # app does (userspace networking, pipe socket) and drive the CLI over
  # that pipe. This is the check that cannot run on a mac dev machine.
  windows-pipe-smoke:
    runs-on: windows-latest
    needs: bundler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-bin-x86_64-pc-windows-msvc
          path: src-tauri/resources/engine/tailscale
      - name: "Sanity: bundled version reports the pinned release"
        shell: bash
        run: ./src-tauri/resources/engine/tailscale/tailscaled.exe --version | grep 1.104.1
      - name: Start daemon on the app's private pipe and probe it
        shell: bash
        run: |
          set -e
          TS=src-tauri/resources/engine/tailscale
          STATEDIR="$(mktemp -d)/state"
          PIPE='\\.\pipe\nebulae-tailscaled'
          # --windows-mode=dev is REQUIRED for a custom pipe (verified live:
          # without it tailscaled rejects the socket outright).
          "$TS/tailscaled.exe" --windows-mode=dev --tun=userspace-networking --port=0 \
            --statedir "$STATEDIR" --socket "$PIPE" \
            --socks5-server=127.0.0.1:1055 \
            --outbound-http-proxy-listen=127.0.0.1:1056 &
          for i in $(seq 1 30); do
            if "$TS/tailscale.exe" --socket "$PIPE" status --json >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          STATE=$("$TS/tailscale.exe" --socket "$PIPE" status --json | \
            python -c "import json,sys; print(json.load(sys.stdin)['BackendState'])")
          echo "backend over pipe: $STATE"
          test "$STATE" = "NeedsLogin"
          # Node identity must persist in the private state dir.
          test -s "$STATEDIR/tailscaled.state"

  # Test package for the Windows desktop validation (supermicro.local):
  # the REAL app build from this branch with the bundled tailscale binaries
  # staged. Uploaded as a WORKFLOW ARTIFACT (never a release asset, never
  # overwrites existing test-build assets). Clear identity in the name.
  test-package-windows:
    runs-on: windows-latest
    needs: bundler
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Stage bundled tailscale binaries (pinned, checksum-verified)
        shell: bash
        run: ./scripts/bundle-tailscale.sh x86_64-pc-windows-msvc
      - name: Build the app (no bundle: binary + resources only)
        run: pnpm tauri build --no-bundle
      - name: Package portable test build
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)
          $dir = "src-tauri/target/release"
          $out = "nebulae-tailscale-test-$sha-win64"
          New-Item -ItemType Directory -Path "$out/resources" -Force | Out-Null
          Copy-Item "$dir/nebulae.exe" $out
          Copy-Item -Recurse "$dir/resources/*" "$out/resources/"
          Write-Output "tailscale binaries staged:"
          Get-ChildItem "$out/resources/engine/tailscale"
          Compress-Archive -Path $out -DestinationPath "$out.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: nebulae-tailscale-test-${{ github.sha }}-win64
          path: nebulae-tailscale-test-*.zip
          retention-days: 7

name: Candidate Build

# Build-only candidate packaging for agent verification (owner-authorized).
# Builds the agreed candidate from an EXPLICIT source SHA and uploads the
# renamed installers + checksums + signatures as WORKFLOW ARTIFACTS only:
# it never creates a release, never moves or creates tags, never touches
# latest.json or any updater asset, and never announces anything.
# Dispatched by the release owner (Antigravity) once the candidate is
# agreed in docs/coordination-record.md; Factory downloads the artifacts,
# verifies their source identity, and runs the acceptance battery.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Exact source SHA/ref to build (the agreed candidate)'
        required: true
        type: string
      legs:
        description: 'Comma-separated legs to build: linux, macos-arm64, macos-x64, windows'
        required: false
        type: string
        default: 'linux'

jobs:
  # Selects the legs named in the "legs" input (default: linux only), so a
  # dispatch builds exactly what the owner asked for.
  plan:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        env:
          LEGS: ${{ github.event.inputs.legs }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          all_legs = {
              "linux": {"platform": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu", "args": "",
                        "artifact_name": "Nebulae-Linux-x86_64", "jre_key": "linux-x64"},
              "macos-arm64": {"platform": "macos-latest", "target": "aarch64-apple-darwin",
                              "args": "--target aarch64-apple-darwin",
                              "artifact_name": "Nebulae-macOS-arm64.dmg", "jre_key": "mac-aarch64"},
              "macos-x64": {"platform": "macos-latest", "target": "x86_64-apple-darwin",
                            "args": "--target x86_64-apple-darwin",
                            "artifact_name": "Nebulae-macOS-x64.dmg", "jre_key": "mac-x64"},
              "windows": {"platform": "windows-latest", "target": "x86_64-pc-windows-msvc", "args": "",
                          "artifact_name": "Nebulae-Setup-x64.exe", "jre_key": "windows-x64"},
          }
          wanted = [x.strip() for x in (os.environ.get("LEGS") or "linux").split(",") if x.strip()]
          unknown = [x for x in wanted if x not in all_legs]
          if unknown or not wanted:
              sys.exit("unknown or empty legs %r (known: %s)" % (unknown or wanted, ", ".join(all_legs)))
          print("matrix=" + json.dumps({"include": [all_legs[x] for x in wanted]}))
          PY

  build-candidate:
    needs: plan
    # Build only: this job never creates a release or a tag and never touches
    # latest.json or an updater asset, so it needs read access only.
    permissions:
      contents: read
    env:
      WINDOWS_SIGN_PROVIDER: ${{ vars.WINDOWS_SIGN_PROVIDER }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      CANDIDATE_REF: ${{ github.event.inputs.ref }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout candidate source (exact SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Record source identity
        shell: bash
        run: |
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" | tee candidate-source.txt
          git log -1 --format='%H%n%ci%n%s' >> candidate-source.txt

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies for Linux (Ubuntu 22.04 pinned baseline)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools \
            patchelf \
            rpm \
            dpkg \
            binutils \
            xvfb \
            desktop-file-utils \
            libdvdnav4 \
            libbluray2 \
            libvlc5 \
            vlc-plugin-base \
            vlc-plugin-video-output

      - name: Bundle libVLC (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p src-tauri/resources/vlc/lib src-tauri/resources/vlc/plugins
          cp -rL /usr/lib/x86_64-linux-gnu/libvlc*.so* src-tauri/resources/vlc/lib/
          cp -rL /usr/lib/x86_64-linux-gnu/vlc/plugins/. src-tauri/resources/vlc/plugins/ || true
          chmod -R u+rwX,go+rX src-tauri/resources/vlc
          ls src-tauri/resources/vlc/lib | head -3

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Temurin JDK 21 (bundled JRE for BD-J/UHD menus)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch Windows Candidate Assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "==> Fetching internal candidate build assets from build-assets-v028-candidate (id: 449252695)..."
          $releaseId = "449252695"
          $assets = gh api repos/koppot/Nebulae-torrent_client/releases/$releaseId/assets | ConvertFrom-Json
          foreach ($asset in $assets) {
              Write-Host "Downloading $($asset.name)..."
              curl.exe -fL -s -H "Authorization: token $env:GH_TOKEN" -H "Accept: application/octet-stream" "https://api.github.com/repos/koppot/Nebulae-torrent_client/releases/assets/$($asset.id)" -o $asset.name
              if (-not (Test-Path $asset.name)) { throw "Failed to download $($asset.name)" }
          }

          # Extract GeoIP databases
          Write-Host "==> Staging GeoIP databases..."
          New-Item -ItemType Directory -Force -Path src-tauri/resources/geo | Out-Null
          tar.exe -xzf geo-databases.tar.gz -C src-tauri/resources/geo

          # Extract licenses
          Write-Host "==> Staging licenses..."
          New-Item -ItemType Directory -Force -Path src-tauri/resources/licenses | Out-Null
          tar.exe -xzf licenses.tar.gz -C src-tauri/resources

          # Stage WebView2Loader.dll
          Copy-Item WebView2Loader.dll -Destination src-tauri/ -Force
          Copy-Item WebView2Loader.dll -Destination src-tauri/resources/ -Force

      - name: Bundle transmission-daemon engine (Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/bundle-windows-transmission.ps1

      - name: Bundle transmission-daemon engine (Linux)
        if: runner.os == 'Linux'
        run: |
          ./scripts/bundle-linux-transmission.sh

      # A candidate must contain the runtime a release would ship, so this uses
      # the same scripts as release.yml (VLC 3.0.23 with the Nebulae patches,
      # libbluray 1.5.0 with its BD-J jars, Transmission with relocated
      # libraries). An earlier version of this step bundled the unpatched
      # official VLC 3.0.21.
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake meson ninja pkgconf bison autoconf automake libtool \
            libevent libdeflate libpsl miniupnpc gettext \
            libudfread fontconfig freetype

      - name: Bundle transmission-daemon engine (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/bundle-macos-transmission.sh

      - name: Bundle libVLC (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/bundle-macos-vlc.sh "${{ matrix.target }}"
          ls src-tauri/resources/vlc

      # Pinned Temurin 21.0.13+9 (size + SHA-256 in scripts/jre-pins.json), the
      # same JRE the Windows kit ships. A download that does not match fails the
      # job; there is no "latest" fallback.
      - name: Bundle JRE (BD-J/UHD menus, pinned Temurin 21.0.13+9)
        shell: bash
        run: ./scripts/bundle-jre.sh "${{ matrix.jre_key }}"

      - name: Setup Go (macOS builds tailscale from source tag)
        if: runner.os == 'macOS'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Bundle tailscale
        shell: bash
        run: ./scripts/bundle-tailscale.sh "${{ matrix.target }}"

      - name: Build Linux packages with bundled player (deb, rpm)
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles deb,rpm

      - name: Build Linux AppImage without engine resources
        if: runner.os == 'Linux'
        run: |
          rm -rf src-tauri/transmission-staging-appimage
          if [ -d src-tauri/resources/engine ]; then
            mv src-tauri/resources/engine src-tauri/transmission-staging-appimage
          fi
          rm -rf src-tauri/vlc-staging-appimage src-tauri/jre-staging-appimage
          mv src-tauri/resources/vlc src-tauri/vlc-staging-appimage
          mv src-tauri/resources/jre src-tauri/jre-staging-appimage
          pnpm tauri build --bundles appimage

      - name: Inject bundled player + engine into AppImage (and refresh updater bundle)
        if: runner.os == 'Linux'
        run: |
          APPIMAGE_PATH="$(find src-tauri/target -name '*.AppImage' -type f | head -n 1)"
          OFFSET="$("$APPIMAGE_PATH" --appimage-offset)"
          dd if="$APPIMAGE_PATH" of=/tmp/appimage-runtime bs="$OFFSET" count=1 status=none
          "$APPIMAGE_PATH" --appimage-extract > /dev/null
          mkdir -p squashfs-root/usr/share/nebulae/resources/engine
          rm -rf squashfs-root/usr/share/nebulae/resources/engine
          cp -a src-tauri/transmission-staging-appimage/. squashfs-root/usr/share/nebulae/resources/engine/
          rm -rf squashfs-root/usr/share/nebulae/resources/vlc squashfs-root/usr/share/nebulae/resources/jre
          cp -a src-tauri/vlc-staging-appimage squashfs-root/usr/share/nebulae/resources/vlc
          cp -a src-tauri/jre-staging-appimage squashfs-root/usr/share/nebulae/resources/jre
          if [ ! -f squashfs-root/usr/share/nebulae/resources/engine/transmission/transmission-daemon ]; then
            echo "ERROR: transmission-daemon missing from AppImage engine staging"
            find squashfs-root/usr/share/nebulae/resources/ -maxdepth 3 | head -30
            exit 1
          fi
          mksquashfs squashfs-root /tmp/appimage-payload.squashfs -root-owned -noappend
          cat /tmp/appimage-runtime /tmp/appimage-payload.squashfs > "$APPIMAGE_PATH.new"
          chmod +x "$APPIMAGE_PATH.new"
          mv "$APPIMAGE_PATH.new" "$APPIMAGE_PATH"
          rm -rf squashfs-root
          LISTING="$(unsquashfs -l /tmp/appimage-payload.squashfs 2>&1 || true)"
          printf '%s\n' "$LISTING" | grep -q "resources/engine/transmission/transmission-daemon" || { echo "ERROR: transmission-daemon missing from repacked AppImage"; exit 1; }
          cd "$(dirname "$APPIMAGE_PATH")"
          NAME="$(basename "$APPIMAGE_PATH")"
          tar -czf "$NAME.tar.gz" "$NAME"
          pnpm tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" "$(pwd)/$NAME.tar.gz"

      - name: Bundle libVLC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "==> Staging Patched VLC 3.0.23 (Blu-ray navigation + menu-first + HDR tonemapping)..."
          New-Item -ItemType Directory -Force -Path src-tauri/resources/vlc | Out-Null
          tar.exe -xf patched-vlc-win64-3.0.23-complete.tar.xz -C src-tauri/resources/vlc
          Get-ChildItem src-tauri/resources/vlc | Select-Object -First 10

          # Clean up downloaded archives so git status is completely clean
          Remove-Item -Force geo-databases.tar.gz, licenses.tar.gz, vcrt140-x64.tar.gz, patched-vlc-win64-3.0.23-complete.tar.xz, WebView2Loader.dll -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force jrex, jre.zip -ErrorAction SilentlyContinue

      - name: Verify clean worktree before compilation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "==> Verifying git status --porcelain before build..."
          $rawStatus = git status --porcelain
          if ($rawStatus) {
            Write-Host "WARNING: untracked or modified files present:"
            Write-Host ($rawStatus | Out-String)
          } else {
            Write-Host "Worktree is 100% clean."
          }

      # tauri.conf.json's "resources/**/*" glob copies hidden files too, so a
      # .DS_Store left by Finder in src-tauri/resources would end up inside the
      # signed app. Remove them before the build; the verification after it
      # proves none are left.
      - name: Remove Finder metadata from the staged resources (macOS)
        if: runner.os == 'macOS'
        run: find src-tauri/resources -name .DS_Store -type f -print -delete

      - name: Build Tauri Application
        if: runner.os != 'Linux'
        run: pnpm tauri build ${{ matrix.args }}

      # No signing identity is configured, so the bundle itself stays unsealed
      # (reported as a note); each nested image is still checked. The x86_64 leg
      # runs on an arm64 runner and bundles helpers built for the runner, so its
      # findings are reported but do not fail the candidate (see
      # scripts/bundle-macos-vlc.sh).
      - name: Verify the macOS app bundle
        if: runner.os == 'macOS'
        continue-on-error: ${{ matrix.target != 'aarch64-apple-darwin' }}
        run: |
          APP_DIR=$(find src-tauri/target -name "Nebulae.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then echo "::error::Nebulae.app was not produced"; exit 1; fi
          ./scripts/verify-macos-app.sh "$APP_DIR"

      - name: Prepare candidate artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_DIR=$(find src-tauri/target -name "Nebulae.app" -type d | head -n 1)
          TAURI_DMG=$(find src-tauri/target -name "*.dmg" -type f | head -n 1)
          ICON_PATH="$(pwd)/src-tauri/icons/icon.icns"
          DMG_NAME="${{ matrix.artifact_name }}"
          DMG_ABS="$(pwd)/$DMG_NAME"

          if [ -n "$APP_DIR" ]; then
            LAYOUT_ARGS=()
            if [ -n "$TAURI_DMG" ]; then
              LAYOUT_ARGS+=(--layout-from "$TAURI_DMG")
            fi
            ./scripts/package-macos-dmg.sh \
              --app "$APP_DIR" \
              --output "$DMG_NAME" \
              --icon "$ICON_PATH" \
              "${LAYOUT_ARGS[@]}"
          elif [ -n "$TAURI_DMG" ]; then
            cp "$TAURI_DMG" "$DMG_NAME"
          fi

          if [ -f "$DMG_NAME" ]; then
            shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"

            if [ -n "$APP_DIR" ]; then
              APP_ZIP="$DMG_NAME-app.zip"
              ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$APP_ZIP"
              shasum -a 256 "$APP_ZIP" > "$APP_ZIP.sha256"
            fi

            UPDATER_TAR=$(find src-tauri/target -name "*.app.tar.gz" -o -name "Nebulae.app.tar.gz" -o -name "*.tar.gz" | head -n 1)
            UPDATER_SIG=$(find src-tauri/target -name "*.app.tar.gz.sig" -o -name "Nebulae.app.tar.gz.sig" -o -name "*.tar.gz.sig" | head -n 1)
            if [ -n "$UPDATER_TAR" ] && [ -n "$UPDATER_SIG" ]; then
              TARGET_TAR="$DMG_NAME-app.tar.gz"
              TARGET_SIG="$DMG_NAME-app.tar.gz.sig"
              cp "$UPDATER_TAR" "$TARGET_TAR"
              cp "$UPDATER_SIG" "$TARGET_SIG"
            fi
          fi

      - name: Prepare candidate artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Candidate builds are UNSIGNED (identical to the current beta path).
          $exe = Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "*setup.exe" | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName -Destination 'Nebulae-Setup-x64.exe' -Force }
          $bin = Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "nebulae.exe" | Select-Object -First 1
          if ($bin) { Copy-Item $bin.FullName -Destination 'nebulae.exe' -Force }
          @(
            "Windows code signing status: UNSIGNED"
            "Provider: none"
            "CANDIDATE BUILD - workflow artifact only, not published"
          ) | Out-File -FilePath 'WINDOWS-SIGNING-STATUS.txt' -Encoding utf8

          foreach ($name in @('Nebulae-Setup-x64.exe', 'nebulae.exe')) {
            if (Test-Path $name) {
              $hash = (Get-FileHash -Path $name -Algorithm SHA256).Hash.ToLower()
              "$hash  $name" | Out-File -FilePath "$name.sha256" -Encoding utf8
            } else {
              Write-Host "Skipping $name - not produced."
            }
          }

          # Tauri updater signature (adjacent .sig from the bundler)
          $expectedSig = if ($exe) { "$($exe.FullName).sig" } else { $null }
          if ($expectedSig -and (Test-Path $expectedSig)) {
            Copy-Item $expectedSig -Destination 'Nebulae-Setup-x64.exe.sig' -Force
          }

          if ($env:TAURI_SIGNING_PRIVATE_KEY -and (Test-Path 'Nebulae-Setup-x64.exe')) {
            Write-Host "Re-signing candidate Windows installer with Tauri minisign..."
            pnpm tauri signer sign -k "$env:TAURI_SIGNING_PRIVATE_KEY" Nebulae-Setup-x64.exe
          }

          if ((Test-Path 'Nebulae-Setup-x64.exe') -and (Test-Path 'Nebulae-Setup-x64.exe.sig')) {
            cargo run --manifest-path src-tauri/Cargo.toml --features ci-verify-payload-signature --bin verify-payload-signature Nebulae-Setup-x64.exe Nebulae-Setup-x64.exe.sig
          } else {
            throw "FATAL: candidate installer or its signature missing!"
          }

          # Prepare Windows portable ZIP: nebulae.exe + app.ico + WebView2Loader.dll + resources/
          Write-Host "==> Building Windows portable candidate ZIP..."
          $portableDir = "Nebulae-Windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item -Path "nebulae.exe" -Destination "$portableDir\nebulae.exe"
          Copy-Item -Path "src-tauri\icons\icon.ico" -Destination "$portableDir\app.ico"
          if (Test-Path "src-tauri\resources\WebView2Loader.dll") {
            Copy-Item -Path "src-tauri\resources\WebView2Loader.dll" -Destination "$portableDir\WebView2Loader.dll"
          } elseif (Test-Path "src-tauri\WebView2Loader.dll") {
            Copy-Item -Path "src-tauri\WebView2Loader.dll" -Destination "$portableDir\WebView2Loader.dll"
          } elseif (Test-Path "WebView2Loader.dll") {
            Copy-Item -Path "WebView2Loader.dll" -Destination "$portableDir\WebView2Loader.dll"
          }
          Copy-Item -Path "src-tauri\resources" -Destination "$portableDir\resources" -Recurse
          Compress-Archive -Path "$portableDir\*" -DestinationPath "Nebulae-Windows-x64-portable.zip" -Force
          $portableHash = (Get-FileHash -Path 'Nebulae-Windows-x64-portable.zip' -Algorithm SHA256).Hash.ToLower()
          "$portableHash  Nebulae-Windows-x64-portable.zip" | Out-File -FilePath 'Nebulae-Windows-x64-portable.zip.sha256' -Encoding utf8
          Write-Host "Portable ZIP generated: Nebulae-Windows-x64-portable.zip ($portableHash)"

      - name: Prepare candidate artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          DEB_FILE=$(find src-tauri/target -name "*.deb" -type f | head -n 1)
          RPM_FILE=$(find src-tauri/target -name "*.rpm" -type f | head -n 1)
          APPIMAGE_FILE=$(find src-tauri/target -name "*.AppImage" -type f | head -n 1)
          BINARY_FILE=$(find src-tauri/target/release -maxdepth 1 -name "nebulae" -type f | head -n 1)

          if [ -n "$DEB_FILE" ]; then
            cp "$DEB_FILE" "Nebulae-Linux-x86_64.deb"
            sha256sum "Nebulae-Linux-x86_64.deb" > "Nebulae-Linux-x86_64.deb.sha256"
          fi
          if [ -n "$RPM_FILE" ]; then
            cp "$RPM_FILE" "Nebulae-Linux-x86_64.rpm"
            sha256sum "Nebulae-Linux-x86_64.rpm" > "Nebulae-Linux-x86_64.rpm.sha256"
          fi
          if [ -n "$APPIMAGE_FILE" ]; then
            cp "$APPIMAGE_FILE" "Nebulae-Linux-x86_64.AppImage"
            chmod +x "Nebulae-Linux-x86_64.AppImage"
            sha256sum "Nebulae-Linux-x86_64.AppImage" > "Nebulae-Linux-x86_64.AppImage.sha256"
          fi
          if [ -n "$BINARY_FILE" ]; then
            cp "$BINARY_FILE" "nebulae-linux-x86_64"
            chmod +x "nebulae-linux-x86_64"
            sha256sum "nebulae-linux-x86_64" > "nebulae-linux-x86_64.sha256"
          fi

          APPIMAGE_TAR=$(find src-tauri/target -name "*.AppImage.tar.gz" -o -name "*appimage*.tar.gz" | head -n 1)
          APPIMAGE_SIG=$(find src-tauri/target -name "*.AppImage.tar.gz.sig" -o -name "*appimage*.tar.gz.sig" | head -n 1)
          if [ -n "$APPIMAGE_TAR" ] && [ -n "$APPIMAGE_SIG" ]; then
            cp "$APPIMAGE_TAR" "Nebulae-Linux-x86_64.AppImage.tar.gz"
            cp "$APPIMAGE_SIG" "Nebulae-Linux-x86_64.AppImage.tar.gz.sig"
          fi

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.run_id }}-${{ matrix.artifact_name }}
          path: |
            candidate-source.txt
            ${{ matrix.artifact_name }}*
            Nebulae-Windows-x64-portable*
            Nebulae-Linux*
            nebulae-linux*
            nebulae.exe*
            WINDOWS-SIGNING-STATUS.txt
            *.deb
            *.rpm
            *.AppImage*
            *.tar.gz*
            *.sig
          if-no-files-found: warn
          retention-days: 14

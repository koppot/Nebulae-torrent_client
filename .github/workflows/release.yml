name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.9.0)'
        required: false
        default: 'v0.9.0'

jobs:
  # Create the release FIRST with exactly one canonical body. The per-platform
  # jobs then upload only their renamed, deduplicated artifacts - tauri-action
  # no longer creates releases or uploads raw duplicate bundles, which had
  # made the asset list confusing (two copies of every bundle).
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          cat > release-body.md <<'BODY'
          ## Nebulae — Torrent Client by Asian DVD Club (@TAG@)

          Native cross-platform torrent client for reliable, high-scale seeding on Windows, macOS, and Linux.

          ### Shipped Packages & Executables
          - **Linux x86_64 (Ubuntu 22.04+ / Debian 12+ era, glibc >= 2.35)**:
            - Debian Package: `Nebulae-Linux-x86_64.deb` (`.deb`)
            - RPM Package: `Nebulae-Linux-x86_64.rpm` (`.rpm`)
            - Portable AppImage: `Nebulae-Linux-x86_64.AppImage` (`.AppImage`)
            - Standalone Binary: `nebulae-linux-x86_64`
          - **Windows x64 Installer**: `Nebulae-Setup-x64.exe`
          - **Windows x64 Executable**: `nebulae.exe`
          - **macOS Apple Silicon (M1/M2/M3/M4/M5)**:
            - `Nebulae-macOS-arm64.dmg` (disk image, Nebulae icon embedded in the volume)
            - `Nebulae-macOS-arm64.dmg-app.zip` (direct application bundle)
            - `Nebulae-macOS-arm64.dmg-app.tar.gz` (silent auto-update payload)
          - **macOS Intel (x86_64)**:
            - `Nebulae-macOS-x64.dmg` (disk image, Nebulae icon embedded in the volume)
            - `Nebulae-macOS-x64.dmg-app.zip` (direct application bundle)
            - `Nebulae-macOS-x64.dmg-app.tar.gz` (silent auto-update payload)

          ### Embedded Optical Disc Cinema Engine
          - Embedded VLC player with native DVD, Blu-ray, and 4K UHD interactive menu playback.
          - Zero third-party player dependencies required on a clean OS; Nebulae uses only its bundled engine.
          - Commercial encrypted discs (AACS/BD+) require prior decryption; raw image dumps and unprotected disc structures are fully supported.

          ### Windows code signing status
          Windows artifacts (`Nebulae-Setup-x64.exe`, `nebulae.exe`) in this release are **unsigned builds**: the SignPath Foundation application was declined (insufficient project history) and no other signing provider is configured. SmartScreen will warn on first run — see the [installation guide](docs/installation.md). Per-release status: `WINDOWS-SIGNING-STATUS.txt`; verify downloads against `SHA256SUMS.txt`.

          ### Verification
          All packages are cataloged in `SHA256SUMS.txt` with individual `.sha256` checksums.

          Refer to the [Installation Guide](docs/installation.md) for platform-specific launch instructions.
          BODY
          sed -i "s/@TAG@/$TAG/g" release-body.md
          gh release create "$TAG" --repo koppot/Nebulae-torrent_client --title "Nebulae $TAG" --notes-file release-body.md --latest

  build-release:
    needs: create-release
    permissions:
      contents: write
    env:
      # Windows code signing is provider-neutral. With no provider configured
      # (the current state: the SignPath Foundation application was declined on
      # 2026-10-14 for insufficient project history), Windows artifacts are
      # published UNSIGNED and the release still succeeds. To enable a provider,
      # set the repository variable WINDOWS_SIGN_PROVIDER plus that provider's
      # credentials; SignPath's are listed in docs/signpath-ci-integration.md.
      WINDOWS_SIGN_PROVIDER: ${{ vars.WINDOWS_SIGN_PROVIDER }}
      # Tauri updater signing: tauri.conf.json enables createUpdaterArtifacts,
      # so tauri build refuses to bundle unless the minisign private key is
      # present in the environment. Both values are repository secrets.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''
            artifact_name: 'Nebulae-Linux-x86_64'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
            artifact_name: 'Nebulae-macOS-arm64.dmg'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
            artifact_name: 'Nebulae-macOS-x64.dmg'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
            artifact_name: 'Nebulae-Setup-x64.exe'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies for Linux (Ubuntu 22.04 pinned baseline)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools \
            patchelf \
            rpm \
            dpkg \
            binutils \
            xvfb \
            desktop-file-utils \
            libdvdnav4 \
            libbluray2 \
            libvlc5 \
            vlc-plugin-base \
            vlc-plugin-video-output

      # Full portability on Linux too: stage the runner's VLC runtime into
      # resources (lib/ + plugins/) exactly like the mac/windows bundles.
      - name: Bundle libVLC (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p src-tauri/resources/vlc/lib src-tauri/resources/vlc/plugins
          cp -rL /usr/lib/x86_64-linux-gnu/libvlc*.so* src-tauri/resources/vlc/lib/
          cp -rL /usr/lib/x86_64-linux-gnu/vlc/plugins/. src-tauri/resources/vlc/plugins/ || true
          chmod -R u+rwX,go+rX src-tauri/resources/vlc
          ls src-tauri/resources/vlc/lib | head -3

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Temurin JDK 21 (bundled JRE for BD-J/UHD menus)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # --- Transmission-daemon sidecar bundling (Phase A1) ------------------
      # Follows the exact mpv precedent: staging dir outside target/, pinned
      # URL + SHA-256 verified in each script, per-leg smoke test.
      - name: Bundle transmission-daemon engine (Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/bundle-windows-transmission.ps1

      - name: Bundle transmission-daemon engine (Linux)
        if: runner.os == 'Linux'
        run: |
          ./scripts/bundle-linux-transmission.sh

      - name: Install transmission-cli on macOS runner
        if: runner.os == 'macOS'
        run: |
          brew install transmission-cli || brew upgrade transmission-cli || true

      - name: Bundle transmission-daemon engine (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/bundle-macos-transmission.sh

      # Playback parity with Windows: libVLC is bundled INSIDE the app
      # (engine.rs prefers <bundle>/Contents/Resources/resources/vlc/lib)
      # so no system VLC install is required on macOS either.
      - name: Bundle libVLC (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then VLCARCH=arm64; else VLCARCH=intel64; fi
          curl -fL -o vlc.dmg "https://download.videolan.org/pub/videolan/vlc/3.0.21/macosx/vlc-3.0.21-${VLCARCH}.dmg"
          hdiutil attach vlc.dmg -mountpoint /tmp/vlcmnt -nobrowse -quiet
          mkdir -p src-tauri/resources/vlc
          cp -R /tmp/vlcmnt/VLC.app/Contents/MacOS/lib src-tauri/resources/vlc/
          cp -R /tmp/vlcmnt/VLC.app/Contents/MacOS/plugins src-tauri/resources/vlc/
          cp -R /tmp/vlcmnt/VLC.app/Contents/Frameworks src-tauri/resources/vlc/ || true
          hdiutil detach /tmp/vlcmnt -quiet || true
          ls src-tauri/resources/vlc

      # Full portability: a private JRE ships inside the app so BD-J / UHD
      # disc menus work with zero system Java (libbluray honours JAVA_HOME).
      - name: Bundle JRE (BD-J/UHD menus)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then OS=windows; EXT=zip; else OS=linux; EXT=tar.gz; [ "$RUNNER_OS" = "macOS" ] && OS=mac || true; fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then A=aarch64; else A=x64; fi
          else
            A=x64
          fi
          curl -fL -o jre.$EXT "https://api.adoptium.net/v3/binary/latest/21/ga/$OS/$A/jre/hotspot/normal/eclipse"
          mkdir -p jrex src-tauri/resources/jre
          if [ "$EXT" = "zip" ]; then
            unzip -q jre.$EXT -d jrex || tar xf jre.$EXT -C jrex
          else
            tar xzf jre.$EXT -C jrex
          fi
          # macOS tarballs nest the runtime in Contents/Home.
          HOME_DIR=$(find jrex -type d -name Home -path '*Contents*' | head -1 || true)
          if [ -z "$HOME_DIR" ]; then
            BIN_DIR=$(find jrex -type d -name bin | head -1)
            HOME_DIR=$(dirname "$BIN_DIR")
          fi
          cp -a "$HOME_DIR"/. src-tauri/resources/jre/
          chmod -R u+rwX,go+rX src-tauri/resources/jre || true
          test -e src-tauri/resources/jre/bin/java || { echo "JRE staging failed"; find jrex | head -20; exit 1; }
          ls src-tauri/resources/jre/bin | head -3

      # --- Linux split build ------------------------------------------------
      # tauri-bundler runs linuxdeploy over the AppDir, and linuxdeploy
      # auto-scans AppDir/usr/lib recursively: the bundled player library
      # tree + JRE under usr/lib/nebulae/resources make it fail. deb/rpm are
      # immune (no linuxdeploy), so they build WITH the player as regular
      # resources; the AppImage is built without them and the player is
      # injected into its squashfs payload afterwards (runtime preserved).
      - name: Build Linux packages with bundled player (deb, rpm)
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles deb,rpm

      - name: Build Linux AppImage without engine resources
        if: runner.os == 'Linux'
        run: |
          # Stage OUTSIDE target/: rust-cache restores target/ between runs and
          # strips the non-cargo blobs, which would nest the move and break
          # the injection probe (squashfs nesting incident, engine parallel).
          # The player is the user's VLC (libVLC loads at runtime) - no mpv
          # staging anymore.
          rm -rf src-tauri/transmission-staging-appimage
          if [ -d src-tauri/resources/engine ]; then
            mv src-tauri/resources/engine src-tauri/transmission-staging-appimage
          fi
          pnpm tauri build --bundles appimage

      - name: Inject bundled player + engine into AppImage (and refresh updater bundle)
        if: runner.os == 'Linux'
        run: |
          # The player is libVLC (user's VLC) - only the transmission
          # engine is injected into the AppImage squashfs.
          APPIMAGE_PATH="$(find src-tauri/target -name '*.AppImage' -type f | head -n 1)"
          OFFSET="$("$APPIMAGE_PATH" --appimage-offset)"
          dd if="$APPIMAGE_PATH" of=/tmp/appimage-runtime bs="$OFFSET" count=1 status=none
          "$APPIMAGE_PATH" --appimage-extract > /dev/null
          mkdir -p squashfs-root/usr/share/nebulae/resources/engine
          rm -rf squashfs-root/usr/share/nebulae/resources/engine
          cp -a src-tauri/transmission-staging-appimage/. squashfs-root/usr/share/nebulae/resources/engine/
          # Same treatment for the bundled VLC runtime and JRE.
          rm -rf squashfs-root/usr/share/nebulae/resources/vlc squashfs-root/usr/share/nebulae/resources/jre
          cp -a src-tauri/resources/vlc squashfs-root/usr/share/nebulae/resources/vlc
          cp -a src-tauri/resources/jre squashfs-root/usr/share/nebulae/resources/jre
          # Verify engine daemon is present
          if [ ! -f squashfs-root/usr/share/nebulae/resources/engine/transmission/transmission-daemon ]; then
            echo "ERROR: transmission-daemon missing from AppImage engine staging"
            find squashfs-root/usr/share/nebulae/resources/ -maxdepth 3 | head -30
            exit 1
          fi
          mksquashfs squashfs-root /tmp/appimage-payload.squashfs -root-owned -noappend
          cat /tmp/appimage-runtime /tmp/appimage-payload.squashfs > "$APPIMAGE_PATH.new"
          chmod +x "$APPIMAGE_PATH.new"
          mv "$APPIMAGE_PATH.new" "$APPIMAGE_PATH"
          rm -rf squashfs-root
          # Verify both player and engine in final image
          LISTING="$(unsquashfs -l /tmp/appimage-payload.squashfs 2>&1 || true)"
          printf '%s\n' "$LISTING" | grep -q "resources/engine/transmission/transmission-daemon" || { echo "ERROR: transmission-daemon missing from repacked AppImage"; exit 1; }
          echo "SUCCESS: engine injected into $APPIMAGE_PATH"
          cd "$(dirname "$APPIMAGE_PATH")"
          NAME="$(basename "$APPIMAGE_PATH")"
          # Regenerate the updater payload from the INJECTED AppImage so
          # auto-updates ship the bundled player and engine, then re-sign it.
          tar -czf "$NAME.tar.gz" "$NAME"
          pnpm tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" "$(pwd)/$NAME.tar.gz"

      # Direct build (replaces tauri-action, which also created the release
      # and uploaded raw, unrenamed bundles alongside the canonical renamed
      # artifacts - the duplicate asset list confusion). The release itself
      # is created by the create-release job; canonical assets are uploaded
      # by the platform prepare steps below.
      # Playback must work out of the box: libVLC is bundled INSIDE the
      # Windows installer (engine.rs prefers resources/vlc/libvlc.dll),
      # so no system VLC install is required.
      - name: Bundle libVLC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://download.videolan.org/pub/videolan/vlc/3.0.21/win64/vlc-3.0.21-win64.zip'
          Invoke-WebRequest -Uri $url -OutFile vlc.zip
          Expand-Archive -Path vlc.zip -DestinationPath vlcextract
          New-Item -ItemType Directory -Force -Path src-tauri/resources/vlc | Out-Null
          Get-ChildItem -Path vlcextract/vlc-3.0.21 -Exclude '*.exe','*.txt','*.nsi','*.html' |
            Copy-Item -Destination src-tauri/resources/vlc -Recurse -Force
          Get-ChildItem src-tauri/resources/vlc | Select-Object -First 10

      - name: Build Tauri Application
        if: runner.os != 'Linux'
        run: pnpm tauri build ${{ matrix.args }}

      # --- Windows code signing (provider-neutral gate) --------------------------
      # WINDOWS_SIGN_PROVIDER selects the provider. Unset/'none'/'unsigned' skips
      # every step below and publishes unsigned artifacts; 'signpath' runs the
      # preserved SignPath block (prepared before the Foundation declined the
      # first application on 2026-10-14 — kept inactive for a future
      # application). A different signing service can be added later as new
      # steps gated on the same WINDOWS_SIGNING_ENABLED condition, without
      # redesigning this workflow. See docs/signpath-ci-integration.md.

      - name: Detect signing provider configuration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $provider = "$env:WINDOWS_SIGN_PROVIDER".Trim().ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($provider) -or $provider -in @('none', 'unsigned')) {
            "WINDOWS_SIGNING_ENABLED=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "No signing provider configured (WINDOWS_SIGN_PROVIDER='$provider') - building UNSIGNED beta artifacts."
          } elseif ($provider -eq 'signpath') {
            if ([string]::IsNullOrWhiteSpace("$env:SIGNPATH_API_TOKEN") -or
                [string]::IsNullOrWhiteSpace("$env:SIGNPATH_ORGANIZATION_ID") -or
                [string]::IsNullOrWhiteSpace("$env:SIGNPATH_PROJECT_SLUG") -or
                [string]::IsNullOrWhiteSpace("$env:SIGNPATH_SIGNING_POLICY_SLUG")) {
              throw "WINDOWS_SIGN_PROVIDER=signpath but one or more SignPath values are unset (SIGNPATH_API_TOKEN secret; SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG variables). Set them all per docs/signpath-ci-integration.md, or unset WINDOWS_SIGN_PROVIDER to publish unsigned."
            }
            "WINDOWS_SIGNING_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "SignPath configured - signing will be requested for nebulae.exe and the installer."
          } else {
            throw "Unsupported WINDOWS_SIGN_PROVIDER '$provider'. Supported values: none/unsigned (default), signpath."
          }

      - name: Upload unsigned nebulae.exe for signing
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        id: upload-exe-signing
        uses: actions/upload-artifact@v4
        with:
          name: nebulae-unsigned-${{ github.run_id }}
          path: src-tauri/target/release/nebulae.exe
          if-no-files-found: error
          retention-days: 5

      - name: Submit nebulae.exe signing request (SignPath)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-exe-signing.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: 'signpath-signed/exe'

      - name: Install signed nebulae.exe into the build tree
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path 'signpath-signed/exe' -Recurse -Filter 'nebulae.exe' | Select-Object -First 1
          if (-not $signed) { throw "Signed nebulae.exe was not returned by SignPath." }
          $hash = (Get-FileHash -Path $signed.FullName -Algorithm SHA256).Hash
          Copy-Item $signed.FullName -Destination 'src-tauri/target/release/nebulae.exe' -Force
          Copy-Item $signed.FullName -Destination 'nebulae.exe' -Force
          "SIGNED_EXE_HASH=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Re-bundle NSIS installer around the signed executable
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: pnpm tauri build --bundles nsis

      - name: Guard - signed executable must be unchanged after bundling
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path 'src-tauri/target/release/nebulae.exe' -Algorithm SHA256).Hash
          if ("$hash" -ne "$env:SIGNED_EXE_HASH") { throw "nebulae.exe changed during bundling; refusing to package an unsigned executable." }
          Write-Host "nebulae.exe in the installer tree matches the SignPath-signed binary."

      - name: Stage installer for signing
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "*setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found in build output." }
          Copy-Item $setup.FullName -Destination 'Nebulae-Setup-x64.exe' -Force

      - name: Upload unsigned installer for signing
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        id: upload-installer-signing
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned-${{ github.run_id }}
          path: Nebulae-Setup-x64.exe
          if-no-files-found: error
          retention-days: 5

      - name: Submit installer signing request (SignPath)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-installer-signing.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: 'signpath-signed/installer'

      - name: Verify Authenticode signatures and timestamps
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $signedSetup = Get-ChildItem -Path 'signpath-signed/installer' -Recurse -Filter 'Nebulae-Setup-x64.exe' | Select-Object -First 1
          if (-not $signedSetup) { throw "Signed installer was not returned by SignPath." }
          Copy-Item $signedSetup.FullName -Destination 'Nebulae-Setup-x64.exe' -Force

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like '*x64*' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found on the runner." }

          & $signtool verify /pa /all /v 'nebulae.exe'
          if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for nebulae.exe" }
          & $signtool verify /pa /all /v 'Nebulae-Setup-x64.exe'
          if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for Nebulae-Setup-x64.exe" }

      # --- End Windows signing block --------------------------------------------

      - name: Prepare and upload named artifact (macOS)
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          APP_DIR=$(find src-tauri/target -name "Nebulae.app" -type d | head -n 1)
          DMG_FILE=$(find src-tauri/target -name "*.dmg" -type f | head -n 1)
          ICON_PATH="$(pwd)/src-tauri/icons/icon.icns"
          DMG_NAME="${{ matrix.artifact_name }}"
          DMG_ABS="$(pwd)/$DMG_NAME"

          echo "=== Building DMG with Embedded Volume Icon ==="
          if [ -n "$APP_DIR" ]; then
            STAGING_DIR=$(mktemp -d)
            cp -R "$APP_DIR" "$STAGING_DIR/Nebulae.app"
            ln -s /Applications "$STAGING_DIR/Applications"
            cp "$ICON_PATH" "$STAGING_DIR/.VolumeIcon.icns"
            SetFile -c icnC "$STAGING_DIR/.VolumeIcon.icns" || true
            rm -f "$DMG_NAME" "$DMG_NAME.rw.dmg"
            # HFS+ is required for the custom-icon flag: hdiutil defaults to
            # APFS on recent runners, where SetFile cannot persist Finder
            # flags and Finder ignores .VolumeIcon.icns (generic white icon,
            # seen in the v0.9.0 release). Build read-write, set the flag ON
            # THE MOUNTED VOLUME ROOT (a srcfolder flag does not survive
            # hdiutil create), then compress to the final UDZO image.
            hdiutil create -volname "Nebulae" -srcfolder "$STAGING_DIR" -fs HFS+ -ov -format UDRW "$DMG_NAME.rw.dmg"
            DMG_MNT="$(mktemp -d)/volume"
            hdiutil attach "$DMG_NAME.rw.dmg" -mountpoint "$DMG_MNT" -nobrowse -noautoopen
            SetFile -a C "$DMG_MNT"
            hdiutil detach "$DMG_MNT"
            hdiutil convert "$DMG_NAME.rw.dmg" -format UDZO -o "$DMG_NAME" -ov
            rm -rf "$STAGING_DIR" "$DMG_NAME.rw.dmg"
            # Verify the flag survived the roundtrip (HFS+ synthesizes
            # FinderInfo into the xattr listing; absence means Finder will
            # show a generic white icon).
            DMG_VERIFY_MNT="$(mktemp -d)/volume"
            hdiutil attach "$DMG_NAME" -mountpoint "$DMG_VERIFY_MNT" -nobrowse -readonly
            xattr -l "$DMG_VERIFY_MNT" 2>/dev/null | grep -q "com.apple.FinderInfo" || {
              echo "ERROR: custom icon flag missing from DMG volume"
              hdiutil detach "$DMG_VERIFY_MNT" || true
              exit 1
            }
            hdiutil detach "$DMG_VERIFY_MNT"
            echo "DMG volume icon verified."
          elif [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" "$DMG_NAME"
          fi

          if [ -f "$DMG_NAME" ]; then
            echo "=== Applying Custom Icon to DMG File ==="
            osascript -l JavaScript -e "
              ObjC.import('AppKit');
              var img = $.NSImage.alloc.initWithContentsOfFile('$ICON_PATH');
              if (img) {
                var res = $.NSWorkspace.sharedWorkspace.setIconForFileOptions(img, '$DMG_ABS', 0);
                console.log('Applied icon to DMG file:', res);
              } else {
                console.log('Failed to load icon from:', '$ICON_PATH');
              }
            " || true
            SetFile -a C "$DMG_ABS" || true

            shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"

            UPLOAD_FILES=("$DMG_NAME" "$DMG_NAME.sha256")

            # Create standalone zip of Nebulae.app with full icon and bundle metadata
            if [ -n "$APP_DIR" ]; then
              APP_ZIP="$DMG_NAME-app.zip"
              ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$APP_ZIP"
              shasum -a 256 "$APP_ZIP" > "$APP_ZIP.sha256"
              UPLOAD_FILES+=("$APP_ZIP" "$APP_ZIP.sha256")
            fi

            # Collect Tauri updater bundles
            UPDATER_TAR=$(find src-tauri/target -name "*.app.tar.gz" -o -name "Nebulae.app.tar.gz" -o -name "*.tar.gz" | head -n 1)
            UPDATER_SIG=$(find src-tauri/target -name "*.app.tar.gz.sig" -o -name "Nebulae.app.tar.gz.sig" -o -name "*.tar.gz.sig" | head -n 1)
            if [ -n "$UPDATER_TAR" ] && [ -n "$UPDATER_SIG" ]; then
              TARGET_TAR="$DMG_NAME-app.tar.gz"
              TARGET_SIG="$DMG_NAME-app.tar.gz.sig"
              cp "$UPDATER_TAR" "$TARGET_TAR"
              cp "$UPDATER_SIG" "$TARGET_SIG"
              UPLOAD_FILES+=("$TARGET_TAR" "$TARGET_SIG")
            fi

            gh release upload "$TAG" "${UPLOAD_FILES[@]}" --clobber || true
          fi

      - name: Prepare and upload named artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ("${{ github.event.inputs.tag_name }}") { "${{ github.event.inputs.tag_name }}" } else { "${{ github.ref_name }}" }

          if ($env:WINDOWS_SIGNING_ENABLED -eq 'true') {
            # Signed path: verify step staged Nebulae-Setup-x64.exe; nebulae.exe was staged when installed into the build tree.
            if (-not (Test-Path 'Nebulae-Setup-x64.exe')) { throw "Signed installer missing before upload." }
            if (-not (Test-Path 'nebulae.exe')) { throw "Signed nebulae.exe missing before upload." }
            Write-Host "Publishing SIGNED Windows artifacts."
            @(
              "Windows code signing status: SIGNED"
              "Provider: $env:WINDOWS_SIGN_PROVIDER"
            ) | Out-File -FilePath 'WINDOWS-SIGNING-STATUS.txt' -Encoding utf8
          } else {
            Write-Host "No signing provider configured - publishing UNSIGNED beta artifacts."
            $exe = Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "*setup.exe" | Select-Object -First 1
            if ($exe) { Copy-Item $exe.FullName -Destination 'Nebulae-Setup-x64.exe' -Force }
            $bin = Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "nebulae.exe" | Select-Object -First 1
            if ($bin) { Copy-Item $bin.FullName -Destination 'nebulae.exe' -Force }
            @(
              "Windows code signing status: UNSIGNED"
              "Provider: none"
              "SignPath Foundation application declined (2026-10-14, insufficient project history); no other signing provider is configured."
              "These are beta builds: SmartScreen will warn on first run. Verify downloads against SHA256SUMS.txt."
            ) | Out-File -FilePath 'WINDOWS-SIGNING-STATUS.txt' -Encoding utf8
          }

          # SHA-256 checksums are always generated from the FINAL (signed when enabled) files.
          foreach ($name in @('Nebulae-Setup-x64.exe', 'nebulae.exe')) {
            if (Test-Path $name) {
              $hash = (Get-FileHash -Path $name -Algorithm SHA256).Hash.ToLower()
              "$hash  $name" | Out-File -FilePath "$name.sha256" -Encoding utf8
              gh release upload "$tag" $name "$name.sha256" --clobber
            } else {
              Write-Host "Skipping $name - not produced."
            }
          }

          # Machine-readable signing status for this release.
          if (Test-Path 'WINDOWS-SIGNING-STATUS.txt') {
            gh release upload "$tag" 'WINDOWS-SIGNING-STATUS.txt' --clobber
          }

          # Stage or re-sign Tauri updater signature (.sig)
          $sig = Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "*.sig" | Select-Object -First 1
          if ($sig) {
            Copy-Item $sig.FullName -Destination 'Nebulae-Setup-x64.exe.sig' -Force
          }
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "Re-signing final Windows installer with Tauri minisign..."
            pnpm tauri signer sign -k "$env:TAURI_SIGNING_PRIVATE_KEY" Nebulae-Setup-x64.exe
          }
          if (Test-Path 'Nebulae-Setup-x64.exe.sig') {
            gh release upload "$tag" 'Nebulae-Setup-x64.exe.sig' --clobber
          }

      - name: Prepare, test, and upload Linux packages (Ubuntu 22.04 baseline)
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "=== Locating Built Linux Bundles ==="
          DEB_FILE=$(find src-tauri/target -name "*.deb" -type f | head -n 1)
          RPM_FILE=$(find src-tauri/target -name "*.rpm" -type f | head -n 1)
          APPIMAGE_FILE=$(find src-tauri/target -name "*.AppImage" -type f | head -n 1)
          BINARY_FILE=$(find src-tauri/target/release -maxdepth 1 -name "nebulae" -type f | head -n 1)

          UPLOAD_FILES=()

          if [ -n "$DEB_FILE" ]; then
            echo "[Found DEB]: $DEB_FILE"
            cp "$DEB_FILE" "Nebulae-Linux-x86_64.deb"
            sha256sum "Nebulae-Linux-x86_64.deb" > "Nebulae-Linux-x86_64.deb.sha256"
            UPLOAD_FILES+=("Nebulae-Linux-x86_64.deb" "Nebulae-Linux-x86_64.deb.sha256")

            echo "=== Validating DEB Package Architecture & Dependencies ==="
            dpkg-deb -I "$DEB_FILE"
            dpkg-deb -c "$DEB_FILE"

            echo "=== Testing Clean DEB Install on Ubuntu 22.04 ==="
            sudo dpkg -i "$DEB_FILE" || sudo apt-get install -f -y

            echo "=== Verifying Binary and Desktop Launcher ==="
            test -x /usr/bin/nebulae || (echo "Binary not found at /usr/bin/nebulae" && exit 1)
            test -f /usr/share/applications/Nebulae.desktop || test -f /usr/share/applications/nebulae.desktop || (echo "Desktop file not found" && exit 1)
            DESKTOP_FILE=$(find /usr/share/applications -iname "*nebulae*.desktop" | head -n 1)
            desktop-file-validate "$DESKTOP_FILE" || true

            echo "=== Testing Installed Application Launch & Runtime-Data Init under Xvfb ==="
            xvfb-run -a /usr/bin/nebulae &
            APP_PID=$!
            sleep 4
            kill -0 $APP_PID || (echo "Installed Nebulae failed to launch under X11" && exit 1)

            echo "=== Verifying XDG Runtime Data Initialization ==="
            test -d "$HOME/.local/share/Nebulae/internal/db" || echo "Note: db dir init"
            test -d "$HOME/.local/share/Nebulae/internal/logs" || echo "Note: logs dir init"

            echo "=== Testing Clean Application Shutdown ==="
            kill -TERM $APP_PID || true
            sleep 1

            echo "=== Testing Clean DEB Uninstall ==="
            sudo dpkg -r nebulae
            test ! -f /usr/bin/nebulae || (echo "Uninstall failed to remove binary" && exit 1)
            sudo dpkg --purge nebulae || true
          fi

          if [ -n "$RPM_FILE" ]; then
            echo "[Found RPM]: $RPM_FILE"
            cp "$RPM_FILE" "Nebulae-Linux-x86_64.rpm"
            sha256sum "Nebulae-Linux-x86_64.rpm" > "Nebulae-Linux-x86_64.rpm.sha256"
            UPLOAD_FILES+=("Nebulae-Linux-x86_64.rpm" "Nebulae-Linux-x86_64.rpm.sha256")

            echo "=== Validating RPM Package Architecture & Metadata ==="
            rpm -qip "$RPM_FILE" || true
            rpm -qp --requires "$RPM_FILE" || true
            rpm -qlp "$RPM_FILE" || true
          fi

          if [ -n "$APPIMAGE_FILE" ]; then
            echo "[Found AppImage]: $APPIMAGE_FILE"
            cp "$APPIMAGE_FILE" "Nebulae-Linux-x86_64.AppImage"
            chmod +x "Nebulae-Linux-x86_64.AppImage"
            sha256sum "Nebulae-Linux-x86_64.AppImage" > "Nebulae-Linux-x86_64.AppImage.sha256"
            UPLOAD_FILES+=("Nebulae-Linux-x86_64.AppImage" "Nebulae-Linux-x86_64.AppImage.sha256")

            echo "=== Testing AppImage Execution under Xvfb ==="
            xvfb-run -a ./Nebulae-Linux-x86_64.AppImage --appimage-extract-and-run &
            APPIMAGE_PID=$!
            sleep 4
            kill -0 $APPIMAGE_PID || echo "AppImage launched in extraction mode"
            kill -TERM $APPIMAGE_PID 2>/dev/null || true
          fi

          if [ -n "$BINARY_FILE" ]; then
            echo "[Found Standalone Binary]: $BINARY_FILE"
            cp "$BINARY_FILE" "nebulae-linux-x86_64"
            chmod +x "nebulae-linux-x86_64"
            sha256sum "nebulae-linux-x86_64" > "nebulae-linux-x86_64.sha256"
            UPLOAD_FILES+=("nebulae-linux-x86_64" "nebulae-linux-x86_64.sha256")
          fi

          # Collect Tauri updater bundles for AppImage
          APPIMAGE_TAR=$(find src-tauri/target -name "*.AppImage.tar.gz" -o -name "*appimage*.tar.gz" | head -n 1)
          APPIMAGE_SIG=$(find src-tauri/target -name "*.AppImage.tar.gz.sig" -o -name "*appimage*.tar.gz.sig" | head -n 1)
          if [ -n "$APPIMAGE_TAR" ] && [ -n "$APPIMAGE_SIG" ]; then
            cp "$APPIMAGE_TAR" "Nebulae-Linux-x86_64.AppImage.tar.gz"
            cp "$APPIMAGE_SIG" "Nebulae-Linux-x86_64.AppImage.tar.gz.sig"
            UPLOAD_FILES+=("Nebulae-Linux-x86_64.AppImage.tar.gz" "Nebulae-Linux-x86_64.AppImage.tar.gz.sig")
          fi

          if [ ${#UPLOAD_FILES[@]} -gt 0 ]; then
            echo "Uploading Linux release artifacts to $TAG: ${UPLOAD_FILES[*]}"
            gh release upload "$TAG" "${UPLOAD_FILES[@]}" --clobber || true
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}*
            Nebulae-Linux*
            nebulae-linux*
            nebulae.exe*
            WINDOWS-SIGNING-STATUS.txt
            *.deb
            *.rpm
            *.AppImage*
            *.tar.gz*
            *.sig
          if-no-files-found: warn

  verify-linux-distros:
    needs: build-release
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: 'Debian 12 (Bookworm)'
            image: 'debian:12'
            type: 'deb'
          - name: 'Ubuntu 24.04 (Noble)'
            image: 'ubuntu:24.04'
            type: 'deb'
          - name: 'Fedora 40'
            image: 'fedora:40'
            type: 'rpm'
          - name: 'openSUSE Leap 15.6'
            image: 'opensuse/leap:15.6'
            type: 'rpm'
    container:
      image: ${{ matrix.distro.image }}
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify package installation on ${{ matrix.distro.name }}
        continue-on-error: true
        run: |
          echo "=== Testing on ${{ matrix.distro.name }} ==="
          if [ "${{ matrix.distro.type }}" = "deb" ]; then
            DEB_FILE=$(find artifacts -name "*.deb" -type f | head -n 1)
            if [ -n "$DEB_FILE" ]; then
              DEB_ABS="$(pwd)/$DEB_FILE"
              export DEBIAN_FRONTEND=noninteractive
              echo "Installing $DEB_ABS on ${{ matrix.distro.name }}..."
              apt-get update
              apt-get install -y "$DEB_ABS" || (dpkg -i "$DEB_ABS" || apt-get install -f -y)
              test -x /usr/bin/nebulae || (echo "Binary missing after install" && exit 1)
              echo "Verifying package removal..."
              dpkg -r nebulae
              test ! -f /usr/bin/nebulae || (echo "Binary present after uninstall" && exit 1)
              dpkg --purge nebulae || true
              echo "SUCCESS: Clean install and uninstall verified on ${{ matrix.distro.name }}"
            fi
          elif [ "${{ matrix.distro.type }}" = "rpm" ]; then
            RPM_FILE=$(find artifacts -name "*.rpm" -type f | head -n 1)
            if [ -n "$RPM_FILE" ]; then
              RPM_ABS="$(pwd)/$RPM_FILE"
              echo "Inspecting and testing $RPM_ABS on ${{ matrix.distro.name }}..."
              if command -v dnf >/dev/null 2>&1; then
                dnf install -y "$RPM_ABS" || echo "Note: DNF dependency check"
              elif command -v zypper >/dev/null 2>&1; then
                zypper --non-interactive install --allow-unsigned-rpm "$RPM_ABS" || echo "Note: Zypper check"
              elif command -v rpm >/dev/null 2>&1; then
                rpm -qip "$RPM_ABS"
              fi
              if [ -f /usr/bin/nebulae ]; then
                echo "Binary found at /usr/bin/nebulae. Testing removal..."
                rpm -e nebulae || true
                test ! -f /usr/bin/nebulae || (echo "Binary present after uninstall" && exit 1)
              fi
              echo "SUCCESS: RPM verification completed on ${{ matrix.distro.name }}"
            fi
          fi

  aggregate-release:
    needs: [build-release, verify-linux-distros]
    if: |
      always() &&
      needs.build-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate unified SHA256SUMS and attach to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          mkdir -p dist-assets
          find artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "nebulae-linux-x86_64" \) ! -name "*.sha256" -exec cp {} dist-assets/ \;
          cd dist-assets
          sha256sum * > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber || true

      - name: Generate latest.json updater manifest and attach to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          # The manifest version MUST equal the packaged app version
          # (tauri.conf.json) and use plain semver without a leading "v",
          # otherwise tauri-plugin-updater cannot compare versions.
          export APP_VERSION="$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          python3 -c '
          import json, os, glob, datetime

          tag = os.environ["TAG"].strip()
          version = os.environ["APP_VERSION"].strip()
          repo_url = "https://github.com/koppot/Nebulae-torrent_client"
          base_url = f"{repo_url}/releases/download/{tag}"

          def read_sig(pattern):
              matches = glob.glob(pattern, recursive=True)
              if matches:
                  with open(matches[0], "r", encoding="utf-8") as f:
                      return f.read().strip()
              return ""

          manifest = {
              "version": version,
              "notes": f"Nebulae {tag} release with silent background auto-updates.",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {}
          }

          sig_mac_arm = read_sig("artifacts/**/Nebulae-macOS-arm64*tar.gz.sig") or read_sig("artifacts/**/*arm64*.sig")
          if sig_mac_arm:
              manifest["platforms"]["darwin-aarch64"] = {
                  "signature": sig_mac_arm,
                  "url": f"{base_url}/Nebulae-macOS-arm64.dmg-app.tar.gz"
              }

          sig_mac_x64 = read_sig("artifacts/**/Nebulae-macOS-x64*tar.gz.sig") or read_sig("artifacts/**/*x64*darwin*.sig")
          if sig_mac_x64:
              manifest["platforms"]["darwin-x86_64"] = {
                  "signature": sig_mac_x64,
                  "url": f"{base_url}/Nebulae-macOS-x64.dmg-app.tar.gz"
              }

          sig_linux = read_sig("artifacts/**/Nebulae-Linux*AppImage.tar.gz.sig") or read_sig("artifacts/**/*linux*.sig")
          if sig_linux:
              manifest["platforms"]["linux-x86_64"] = {
                  "signature": sig_linux,
                  "url": f"{base_url}/Nebulae-Linux-x86_64.AppImage.tar.gz"
              }

          sig_win = read_sig("artifacts/**/Nebulae-Setup-x64.exe.sig") or read_sig("artifacts/**/*setup*.sig")
          if sig_win:
              manifest["platforms"]["windows-x86_64"] = {
                  "signature": sig_win,
                  "url": f"{base_url}/Nebulae-Setup-x64.exe"
              }

          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)

          print("Generated latest.json:")
          print(json.dumps(manifest, indent=2))
          '
          gh release upload "$TAG" latest.json --clobber || true

      - name: Broadcast release announcement on Discord
        env:
          TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
          # SECURITY: the webhook URL was previously hardcoded here and leaked in git
          # history. The old webhook must be revoked in Discord and re-created; store
          # the new one as the repository secret DISCORD_RELEASE_WEBHOOK_URL.
          ANNOUNCEMENT_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          python3 -c '
          import os, json, urllib.request

          tag = os.environ.get("TAG", "").strip()
          if not tag:
              raise SystemExit("TAG is not set; cannot announce the release")
          webhook = os.environ.get("ANNOUNCEMENT_WEBHOOK")
          if not webhook:
              print("DISCORD_RELEASE_WEBHOOK_URL not configured; skipping announcement.")
              raise SystemExit(0)
          repo_url = "https://github.com/koppot/Nebulae-torrent_client"
          logo = "https://asiandvdclub.org/images/logo.png"

          embed = {
              "title": f"🚀 Nebulae {tag} Released!",
              "url": f"{repo_url}/releases/tag/{tag}",
              "description": f"Official release build of **Nebulae** ({tag}) is now published and available for download on Windows, macOS, and Linux.",
              "color": 15010068,
              "thumbnail": {"url": logo},
              "fields": [
                  {
                      "name": "🐧 Linux (x86_64 - Ubuntu 22.04+ / Debian 12+)",
                      "value": f"[DEB Package]({repo_url}/releases/download/{tag}/Nebulae-Linux-x86_64.deb) • [RPM Package]({repo_url}/releases/download/{tag}/Nebulae-Linux-x86_64.rpm) • [AppImage]({repo_url}/releases/download/{tag}/Nebulae-Linux-x86_64.AppImage)",
                      "inline": False
                  },
                  {
                      "name": "🍏 macOS (Apple Silicon)",
                      "value": f"[DMG Image]({repo_url}/releases/download/{tag}/Nebulae-macOS-arm64.dmg) • [App.zip]({repo_url}/releases/download/{tag}/Nebulae-macOS-arm64.dmg-app.zip)",
                      "inline": False
                  },
                  {
                      "name": "🖥️ macOS (Intel x86_64)",
                      "value": f"[DMG Image]({repo_url}/releases/download/{tag}/Nebulae-macOS-x64.dmg) • [App.zip]({repo_url}/releases/download/{tag}/Nebulae-macOS-x64.dmg-app.zip)",
                      "inline": False
                  },
                  {
                      "name": "🪟 Windows (x64)",
                      "value": f"[Setup Installer]({repo_url}/releases/download/{tag}/Nebulae-Setup-x64.exe) • [Executable]({repo_url}/releases/download/{tag}/nebulae.exe)",
                      "inline": False
                  },
                  {
                      "name": "📦 Checksums & Verification",
                      "value": f"Verified via [SHA256SUMS.txt]({repo_url}/releases/download/{tag}/SHA256SUMS.txt)",
                      "inline": False
                  }
              ],
              "footer": {"text": "Asian DVD Club Community • Automated Release Pipeline", "icon_url": logo}
          }

          payload = {
              "username": "Nebulae Core",
              "avatar_url": logo,
              "content": f"📢 **New Release Announcement:** `{tag}` is now live! @everyone",
              "embeds": [embed]
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "GitHub-Actions-Release"}
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print(f"Announced {tag} to Discord: HTTP {resp.status}")
          except Exception as e:
              print(f"Warning: Failed to send announcement: {e}")
          ' || true

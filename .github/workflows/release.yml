name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
    matrix:
      include:
        - platform: 'macos-latest'
          target: 'aarch64-apple-darwin'
          artifact_name: 'Nebulae-macOS-arm64.dmg'
        - platform: 'macos-13'
          target: 'x86_64-apple-darwin'
          artifact_name: 'Nebulae-macOS-x64.dmg'
        - platform: 'windows-latest'
          target: 'x86_64-pc-windows-msvc'
          artifact_name: 'Nebulae-Setup-x64.exe'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Nebulae ${{ github.ref_name }}'
          releaseBody: |
            ## Nebulae — Torrent Client by Asian DVD Club (${{ github.ref_name }})
            
            ### Package Artifacts:
            - **Windows x64**: `Nebulae-Setup-x64.exe` (installs `nebulae.exe`)
            - **macOS Apple Silicon (M1/M2/M3/M4)**: `Nebulae-macOS-arm64.dmg` (mounts `Nebulae.app`)
            - **macOS Intel (x86_64)**: `Nebulae-macOS-x64.dmg` (mounts `Nebulae.app`)
            
            Refer to [Installation Guide](docs/installation.md) for step-by-step instructions.
          releaseDraft: true
          prerelease: false

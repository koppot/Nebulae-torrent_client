[package]
name = "nebulae_torrent_client"
version = "0.9.2"
description = "Nebulae — Torrent Client by Asian DVD Club"
edition = "2021"
default-run = "nebulae"

[lib]
name = "nebulae_torrent_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nebulae"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
url = "2"
sha1 = "0.11.0"
serde_bencode = "0.2.4"
serde_bytes = "0.11.19"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
keyring = "3"
network-interface = "2.0.5"
roxmltree = "0.20"
base64 = "0.22"
axum = "0.8"
tauri-plugin-process = "2"
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
maxminddb = "0.24"
md5 = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSGraphics", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
raw-window-handle = "0.6"
